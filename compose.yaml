name: trainer-sync-local
x-mock-env: &mock-env
  APP_MODE: mock
  ADAPTER_MODE: mock
  EXTERNAL_CONNECTIONS_ENABLED: "false"
  DATABASE_URL: postgresql://trainer:local_mock_only@postgres:5432/trainer_sync
  ACTIVE_TRAINER_ID: trainer-demo
  APP_ORIGIN: http://127.0.0.1:4310
  PUBLIC_ORIGIN: http://127.0.0.1:4310
  NEXT_TELEMETRY_DISABLED: "1"
x-app-logging: &app-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: local_mock_only
      POSTGRES_DB: trainer_sync
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U trainer -d trainer_sync"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "no"
    networks: [private]
  web:
    logging: *app-logging
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      <<: *mock-env
      SEED_SYNTHETIC_DATA: "true"
    ports:
      - "127.0.0.1:4310:3000"
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    init: true
    restart: "no"
    networks: [private, frontend]
  worker:
    logging: *app-logging
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *mock-env
    depends_on:
      postgres: {condition: service_healthy}
      web: {condition: service_healthy}
    init: true
    restart: "no"
    networks: [private]
  test-postgres:
    profiles: [test]
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: local_mock_only
      POSTGRES_DB: trainer_sync_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U trainer -d trainer_sync_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [private]
  tester:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      <<: *mock-env
      DATABASE_URL: postgresql://trainer:local_mock_only@test-postgres:5432/trainer_sync_test
      TEST_DATABASE_URL: postgresql://trainer:local_mock_only@test-postgres:5432/trainer_sync_test
      BASE_URL: http://web:3000
    depends_on:
      test-postgres: {condition: service_healthy}
    command: [npm, run, check]
    volumes:
      - ./test-results:/app/test-results
    init: true
    networks: [private]
volumes:
  pgdata:
networks:
  private:
    internal: true
  frontend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
